[project]
name = "objectstream-qwen35"
version = "0.2.3"
description = "Training-free object-centric visual memory for native Qwen3.5"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==1.26.4",
    "torch==2.6.0",
    "requests==2.32.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["objectstream"]

[tool.pytest.ini_options]
testpaths = ["tests"]
