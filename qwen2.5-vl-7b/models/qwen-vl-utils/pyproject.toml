[project]
name = "qwen-vl-utils-objectstream"
version = "0.1.0"
description = "Image and video preprocessing helpers for ObjectStream"
requires-python = ">=3.10,<3.12"
dependencies = [
    "av==14.2.0",
    "packaging>=24.2",
    "pillow>=11.1.0",
    "requests>=2.32.3",
    "torchvision==0.21.0",
]

[project.optional-dependencies]
decord = ["decord==0.6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_vl_utils_objectstream"]
