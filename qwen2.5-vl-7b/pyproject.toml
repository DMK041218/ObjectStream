[project]
name = "objectstream"
version = "0.2.3"
description = "Training-free object-centric visual memory for Qwen2.5-VL"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy==1.26.4",
    "torch==2.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["objectstream"]

[tool.pytest.ini_options]
testpaths = ["tests"]
