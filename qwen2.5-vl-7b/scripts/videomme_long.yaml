dataset_path: lmms-lab/Video-MME
dataset_kwargs:
  token: True
  cache_dir: videomme
  video: True
task: videomme_long
test_split: test
output_type: generate_until
process_docs: !function videomme_long_utils.videomme_long_process_docs
doc_to_visual: !function videomme_long_utils.videomme_doc_to_visual
doc_to_text: !function videomme_long_utils.videomme_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 16
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
process_results: !function videomme_long_utils.videomme_process_results
metric_list:
  - metric: videomme_perception_score
    aggregation: !function videomme_long_utils.videomme_aggregate_results
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer with the option's letter from the given choices directly."
  gpt4v:
    pre_prompt: ""
    post_prompt: "Answer the question with A, B, C, or D."
  llava_vid:
    pre_prompt: ""
    post_prompt: "The best answer is:"
  xcomposer2_4khd:
    pre_prompt: "[UNUSED_TOKEN_146]user\n"
    post_prompt: " Answer this question with A, B, C, or D.[UNUSED_TOKEN_145]\n[UNUSED_TOKEN_146]assistant\n"
metadata:
  - version: 0.0
